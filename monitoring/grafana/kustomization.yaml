apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: workshop-app-resources-k6
    files:
      - dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: workshop-database-connections-dashboard
    files:
      - labs/database-connections.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: workshop-file-descriptors-dashboard
    files:
      - labs/file-descriptors.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: workshop-event-loop-lag-dashboard
    files:
      - labs/event-loop-lag.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
