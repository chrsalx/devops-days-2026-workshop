crds:
  install: true

prometheus:
  operator:
    enabled: true
    podMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  serviceMonitor:
    enabled: true

resources:
  operator:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  metricServer:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  webhooks:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi