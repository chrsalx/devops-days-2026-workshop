apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  labels:
    app.kubernetes.io/name: cadvisor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cadvisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadvisor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: cadvisor
          image: ghcr.io/google/cadvisor:0.54.0
          args:
            - --containerd=/run/containerd/containerd.sock
            - --containerd-namespace=k8s.io
            - --housekeeping_interval=15s
            - --max_housekeeping_interval=30s
            - --event_storage_event_limit=default=0
            - --event_storage_age_limit=default=0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: host-root
              mountPath: /rootfs
              readOnly: true
            - name: host-sys
              mountPath: /sys
              readOnly: true
            - name: host-cgroups
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: host-containerd-run
              mountPath: /run/containerd
              readOnly: true
            - name: host-containerd-data
              mountPath: /var/lib/containerd
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-cgroups
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: host-containerd-run
          hostPath:
            path: /run/containerd
            type: Directory
        - name: host-containerd-data
          hostPath:
            path: /var/lib/containerd
            type: Directory