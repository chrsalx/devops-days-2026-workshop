apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: file-descriptors
  namespace: file-descriptors
spec:
  scaleTargetRef:
    name: file-descriptors
  minReplicaCount: 1
  maxReplicaCount: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        query: sum(process_open_fds{namespace="file-descriptors", pod=~"file-descriptors-.*"})
        threshold: "24"
