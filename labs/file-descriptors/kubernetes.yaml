apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-descriptors
  namespace: file-descriptors
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-descriptors
  template:
    metadata:
      labels:
        app: file-descriptors
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: app
          image: workshop-file-descriptors:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: file-descriptors
  namespace: file-descriptors
spec:
  selector:
    app: file-descriptors
  ports:
    - name: http
      port: 8080
      targetPort: http