apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: database-connections
  namespace: database-connections
spec:
  scaleTargetRef:
    name: database-connections
  minReplicaCount: 1
  maxReplicaCount: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        query: 100 * sum(gorm_dbstats_in_use{db_name="workshop",namespace="database-connections",pod=~"database-connections-.*"}) / avg(gorm_dbstats_max_open_connections{db_name="workshop",namespace="database-connections",pod=~"database-connections-.*"})
        threshold: "70"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
