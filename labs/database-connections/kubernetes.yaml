apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: database-connections
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: workshop
            - name: POSTGRES_USER
              value: workshop
            - name: POSTGRES_PASSWORD
              value: workshop
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U workshop -d workshop"]
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U workshop -d workshop"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: database-connections
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-connections
  namespace: database-connections
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database-connections
  template:
    metadata:
      labels:
        app: database-connections
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: app
          image: workshop-database-connections:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgres://workshop:workshop@postgres:5432/workshop?sslmode=disable
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: database-connections
  namespace: database-connections
spec:
  selector:
    app: database-connections
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: database-connections
  namespace: database-connections
spec:
  scaleTargetRef:
    name: database-connections
  minReplicaCount: 1
  maxReplicaCount: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        query: sum(gorm_dbstats_in_use{db_name="workshop", namespace="database-connections", pod=~"database-connections-.*"})
        threshold: "2"