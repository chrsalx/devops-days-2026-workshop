apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-client-upstream
  namespace: http-client-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-client-upstream
  template:
    metadata:
      labels:
        app: http-client-upstream
    spec:
      containers:
        - name: upstream
          image: workshop-http-upstream:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: upstream
  namespace: http-client-pool
spec:
  selector:
    app: http-client-upstream
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-client-pool
  namespace: http-client-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-client-pool
  template:
    metadata:
      labels:
        app: http-client-pool
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: app
          image: workshop-http-client-pool:local
          imagePullPolicy: IfNotPresent
          env:
            - name: UPSTREAM_URL
              value: http://upstream:8081/slow
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: http-client-pool
  namespace: http-client-pool
spec:
  selector:
    app: http-client-pool
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: http-client-pool
  namespace: http-client-pool
spec:
  scaleTargetRef:
    name: http-client-pool
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 15
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        query: sum(http_client_pool_waiters{namespace="http-client-pool", pod=~"http-client-pool-.*"})
        threshold: "1"